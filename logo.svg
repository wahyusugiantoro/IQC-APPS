  <!-- Label -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="52" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="10">IQC</text>
</svg>
